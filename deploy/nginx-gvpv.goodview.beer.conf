# New subdomain for GVPV mold warehouse (PM2 on PORT, default 3001).
# Install: sudo cp deploy/nginx-gvpv.goodview.beer.conf /etc/nginx/sites-available/gvpv.goodview.beer
#          sudo ln -sf /etc/nginx/sites-available/gvpv.goodview.beer /etc/nginx/sites-enabled/
# TLS:     sudo certbot --nginx -d gvpv.goodview.beer

server {
    listen 80;
    server_name gvpv.goodview.beer;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}